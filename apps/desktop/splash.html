<!doctype html>
<html lang="tr">
  <head>
    <meta charset="utf-8" />
    <title>IGOR</title>
    <style>
      html, body { margin: 0; height: 100%; background: #0a0a0a; color: #fafafa; font-family: "Segoe UI", system-ui, sans-serif; -webkit-app-region: drag; user-select: none; }
      body { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; }
      img { width: 56px; height: 56px; }
      h1 { margin: 0; font-size: 22px; letter-spacing: 0.06em; }
      p { margin: 0; font-size: 12px; color: #a1a1aa; }
      .bar { width: 160px; height: 3px; border-radius: 3px; background: #27272a; overflow: hidden; }
      .bar::after { content: ""; display: block; width: 40%; height: 100%; background: #dc2626; animation: slide 1.1s ease-in-out infinite; }
      @keyframes slide { from { transform: translateX(-100%); } to { transform: translateX(250%); } }
    </style>
  </head>
  <body>
    <img src="assets/icon.png" alt="" />
    <h1>IGOR</h1>
    <div class="bar"></div>
    <p>Stüdyo başlatılıyor...</p>
  </body>
</html>
